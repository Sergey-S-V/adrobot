[project]
name = "adrobot"
version = "0.1.0"
description = "Keitaro campaign creator and offer editor"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.13",
  "fastapi>=0.121",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "pycountry>=26.2.16",
  "pydantic-settings>=2.5",
  "sqlalchemy>=2.0",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=8.3",
    "ruff>=0.17.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/adrobot"]

[tool.hatch.build.targets.wheel.force-include]
"backend/migrations" = "adrobot/migrations"

[tool.mypy]
python_version = "3.12"
files = ["backend/src/adrobot"]
strict = true

[[tool.mypy.overrides]]
module = ["pycountry"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend/src", "."]


[tool.ruff]
line-length = 100
target-version = "py312"
