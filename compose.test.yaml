name: adrobot-tdd
services:
  postgres-test:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: adrobot_test
      POSTGRES_PASSWORD: adrobot_test
      POSTGRES_DB: adrobot_test
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adrobot_test -d adrobot_test"]
      interval: 1s
      timeout: 3s
      retries: 30
